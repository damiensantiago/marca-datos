<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>MARCA Datos</title>
<meta name="description" content="Resultados, partidos, clasificaciones y estadísticas de jugadores. Prototipo.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MARCA Datos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: app móvil de una columna. Cabeceras siempre negras, contenido en tarjetas, barra inferior flotante. Negro + rojo. */
:root{
  --bg:#000000; --surface:#131316; --surface2:#1c1d22; --chip:#26272d; --line:#24252b; --fg:#f5f5f7; --muted:#8d909a;
  --accent:#e2001a; --live:#ff2d3d; --blue:#4d7cff; --gold:#f2b200; --hdr:#000000;
  --pitch:#1f6b3e; --pitch2:#1c623a; --ok:#1fbf4a;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
  --gl:max(16px, env(safe-area-inset-left,0px)); --gr:max(16px, env(safe-area-inset-right,0px));
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f0f1f4; --surface:#ffffff; --surface2:#f4f5f7; --chip:#eceef2; --line:#e5e7ec; --fg:#121316; --muted:#6a6e78;
  --accent:#d0001a; --live:#e2001a; --blue:#2f5ee8; --pitch:#2f8a4c; --pitch2:#2b8046; color-scheme:light;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body{min-height:100vh;min-height:100dvh}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--st);z-index:30;background:var(--hdr)}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
svg{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:500px;margin:0 auto;padding-bottom:calc(96px + var(--sb))}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;background:#000;display:grid;place-items:center;transition:opacity .4s}
#splash div{display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff}
#splash img{width:84px;height:84px;border-radius:20px}
#splash b{font-size:22px;letter-spacing:-.02em}
#splash b span{color:var(--accent)}
#splash.out{opacity:0;pointer-events:none}

/* Cabecera portada */
.hdr{background:var(--hdr);color:#fff;padding-top:var(--st)}
.hrow{display:flex;align-items:center;gap:10px;padding:10px var(--gr) 10px var(--gl)}
.logo{width:34px;height:34px;border-radius:9px;flex:none}
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:#1c1d22;border-radius:999px;height:40px;padding:0 14px;color:#8d909a;font-size:14px;min-width:0}
.sbox svg{width:18px;height:18px;flex:none}
.sbox span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:#fff;flex:none;position:relative}
.ib svg{width:22px;height:22px}
.ib .pip{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.sports{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 var(--gr) 0 var(--gl)}
.sports::-webkit-scrollbar,.tabs::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.sport{flex:1 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:9px 12px 8px;font-size:11.5px;font-weight:600;color:#8d909a;border-radius:12px 12px 0 0}
.sport svg{width:22px;height:22px}
.sport.on{background:var(--bg);color:var(--fg)}
.sport.on svg{color:var(--accent)}
.sport:not(.on) span{display:none}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:999px;padding:3px;margin:12px var(--gr) 0 var(--gl)}
.seg button{height:36px;border-radius:999px;font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:.06em;color:var(--muted)}
.seg button.on{background:var(--fg);color:var(--bg)}
.adslot{margin:12px var(--gr) 0 var(--gl);height:56px;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--surface)}
.frow{display:flex;gap:8px;align-items:center;padding:12px var(--gr) 4px var(--gl)}
.pill{height:38px;display:inline-flex;align-items:center;gap:7px;padding:0 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13.5px;flex:none}
.pill svg{width:17px;height:17px}
.pill.live{color:var(--live);border-color:var(--live)}
.pill.live .ring{width:13px;height:13px;border-radius:50%;border:2px solid currentColor}
.pill.live.on{background:var(--live);color:#fff}
.pill.live.on .ring{background:#fff;border-color:#fff;animation:pulse 1.3s infinite}
.pill.on{border-color:var(--fg)}
@keyframes pulse{50%{opacity:.3}}
.dnav{flex:1;display:flex;align-items:center;justify-content:space-between;height:38px;border-radius:999px;background:var(--surface);border:1px solid var(--line);min-width:0}
.dnav button{width:38px;height:36px;display:grid;place-items:center;color:var(--accent)}
.dnav button svg{width:18px;height:18px}
.dnav span{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnav span.today{color:var(--accent)}

/* Tarjetas y filas */
.card{background:var(--surface);border-radius:16px;margin:12px var(--gr) 0 var(--gl);overflow:hidden}
.card.pad{padding:16px}
.card h3{font-size:16px;font-weight:700;margin:0 0 14px;letter-spacing:-.01em}
.card h3 small{display:block;font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.ghead{display:flex;align-items:center;gap:12px;padding:12px 10px 8px 14px;cursor:pointer}
.clogo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;font-family:var(--cond);font-weight:700;font-size:13px;color:#fff;letter-spacing:.02em}
.ghead .t{flex:1;min-width:0}
.ghead b{display:flex;align-items:center;gap:6px;font-size:14px}
.ghead small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin-top:2px}
.circ{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none}
.circ svg{width:19px;height:19px}
.circ.on{color:var(--gold);border-color:var(--gold)}
.circ.bell.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.mrow{display:grid;grid-template-columns:62px 1fr auto 52px;align-items:center;padding:7px 0;cursor:pointer;min-height:64px}
.mrow:active{background:var(--surface2)}
.mstat{font-size:12px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:3px;line-height:1.2}
.mstat .lv{color:var(--live);font-weight:700}
.tl{display:flex;align-items:center;gap:9px;height:25px;font-size:15px;min-width:0}
.tl span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl.lose{color:var(--muted)}
.msc{display:flex;flex-direction:column;align-items:flex-end;font-weight:700;font-size:15px;padding-right:2px}
.msc span{height:25px;line-height:25px}
.msc.lv{color:var(--live)}
.mrow .circ{margin:0 auto;width:38px;height:38px}
.cw{display:inline-flex;flex:none;filter:drop-shadow(0 0 .6px rgba(0,0,0,.7))}
.crest{width:var(--s);height:var(--s);display:grid;place-items:center;font-family:var(--cond);font-size:calc(var(--s)*.42);font-weight:700;clip-path:polygon(50% 0,100% 13%,100% 58%,50% 100%,0 58%,0 13%);padding-bottom:calc(var(--s)*.08)}
.flag{width:18px;height:13px;border-radius:2px;flex:none;overflow:hidden}
.fab-today{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--sb));z-index:15;background:var(--accent);color:#fff;border-radius:999px;height:42px;padding:0 20px;display:flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:700;font-size:17px;letter-spacing:.06em;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.fab-today svg{width:16px;height:16px}

/* Barra inferior flotante */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 var(--gr) calc(10px + var(--sb)) var(--gl);pointer-events:none}
.nav-in{pointer-events:auto;max-width:468px;margin:0 auto;display:flex;padding:5px;border-radius:999px;background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;border-radius:999px;font-size:11px;font-weight:600;color:var(--fg)}
.nav a svg{width:23px;height:23px}
.nav a.on{background:var(--chip);color:var(--accent)}

/* Cabecera de detalle (partido, equipo, jugador, liga) */
.dh{color:#fff;padding-top:var(--st);background:var(--g, #141416)}
.dbar{display:flex;align-items:center;gap:4px;padding:6px calc(var(--gr) - 6px) 0 calc(var(--gl) - 8px);height:52px}
.dbar .sp{flex:1}
.dscore{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:6px;padding:6px var(--gr) 14px var(--gl)}
.dside{display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;font-weight:600;font-size:14px;cursor:pointer;min-width:0}
.dside .cr{display:flex;align-items:center;gap:10px}
.dside .cr button{color:rgba(255,255,255,.85)} .dside .cr button svg{width:20px;height:20px}
.dside .cr button.on{color:var(--gold)}
.dmid{text-align:center;padding-top:12px;min-width:96px}
.dmid .big{font-family:var(--cond);font-size:44px;font-weight:700;line-height:1;letter-spacing:.01em}
.dmid .big.t{font-size:34px}
.dmid .st{font-size:13px;margin-top:6px;color:rgba(255,255,255,.8);display:flex;justify-content:center;gap:6px;align-items:center}
.dmid .st.lv{color:#ff5a66;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.3s infinite}
.goals{display:grid;grid-template-columns:1fr 20px 1fr;gap:6px;padding:0 var(--gr) 12px var(--gl);font-size:12px;color:rgba(255,255,255,.75)}
.goals div:first-child{text-align:right}
.goals svg{width:14px;height:14px;margin:1px auto 0;opacity:.8}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;position:sticky;top:var(--st);z-index:12;background:var(--g2, #141416);padding:0 var(--gr) 0 calc(var(--gl) - 12px)}
.tab{flex:none;padding:14px 12px 12px;font-size:15px;font-weight:600;color:rgba(255,255,255,.55);border-bottom:3px solid transparent}
.tab.on{color:#fff;border-color:var(--accent)}
.phead{display:flex;align-items:center;gap:14px;padding:4px var(--gr) 16px var(--gl)}
.phead h1{font-size:23px;letter-spacing:-.02em;line-height:1.15}
.phead p{display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.85);font-size:15px;margin-top:4px;cursor:pointer}
.phead .fol{margin-left:auto;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;text-align:center;font-size:12px;color:rgba(255,255,255,.75);flex:none}
.phead .fol b{display:block;color:#fff;font-size:14px}
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px var(--gr) 0 var(--gl)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 15px;border-radius:999px;background:var(--chip);font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--fg);color:var(--bg)}
.chip select{appearance:none;-webkit-appearance:none;background:none;border:0;font-weight:600}

/* Partido: bloques */
.link-card{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;font-size:14px;font-weight:500}
.link-card>span:not(.clogo){flex:1;min-width:0}
.club-card .rb{color:#fff}
.link-card svg.chev{color:var(--accent);width:20px;height:20px}
.mini th{color:var(--muted);font-weight:500;font-size:12.5px;padding:0 4px 10px;text-align:center}
.mini td{padding:9px 4px;text-align:center;font-size:14px}
.mini .tm{text-align:left}
.mini .tm div{display:flex;gap:10px;align-items:center}
.poll{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.poll button{height:44px;border-radius:999px;border:1.5px solid var(--accent);font-weight:700;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:6px}
.poll button i{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.22}
.poll button.me{background:var(--accent);color:#fff}
.poll button span{position:relative}
.poll-cap{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
.h2h{display:flex;align-items:center;justify-content:center;gap:18px}
.h2h b{font-family:var(--cond);font-size:30px}
.h2h .sep{width:1px;height:30px;background:var(--line)}
.inc{display:grid;grid-template-columns:1fr 44px 1fr;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;gap:4px}
.inc:last-child{border:0}
.inc .min{text-align:center;font-weight:700;font-size:12.5px;color:var(--muted)}
.inc .l,.inc .r{display:flex;gap:8px;align-items:center;min-width:0;cursor:pointer}
.inc .l{justify-content:flex-end;text-align:right}
.inc small{display:block;color:var(--muted);font-size:11.5px}
.inc .sc{font-weight:800;font-size:12px;background:var(--chip);border-radius:5px;padding:3px 6px}
.ico{width:16px;height:16px;flex:none}
.yc,.rcd{width:11px;height:15px;border-radius:2px;flex:none;background:var(--gold);display:inline-block}
.rcd{background:var(--live)}
.period{text-align:center;font-size:11px;font-weight:700;color:var(--muted);background:var(--surface2);border-radius:8px;padding:7px;margin:8px 0;text-transform:uppercase;letter-spacing:.08em}
.legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.str{padding:10px 0}
.str-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600}
.str-top .lb{color:var(--muted);font-size:13px;font-weight:500}
.str-top .v{padding:2px 8px;border-radius:6px}
.str-top .v.wh{background:var(--accent);color:#fff}
.str-top .v.wa{background:var(--blue);color:#fff}
.str-bars{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}
.str-bars div{height:7px;border-radius:4px;background:var(--surface2);display:flex;overflow:hidden}
.str-bars div:first-child{justify-content:flex-end}
.str-bars i{display:block;height:100%;border-radius:4px}
.bh{background:var(--accent)}.ba{background:var(--blue)}.bl{background:var(--muted);opacity:.35}

/* Alineaciones */
.lu-head{display:flex;align-items:center;gap:12px;padding:16px}
.lu-head b{font-size:17px}
.lu-head .fm2{margin-left:auto;text-align:center;font-family:var(--cond);font-weight:700;font-size:18px}
.shirt{width:34px;height:30px;margin:2px auto 0}
.pitch{position:relative;background:repeating-linear-gradient(180deg,var(--pitch) 0 56px,var(--pitch2) 56px 112px)}
.pitch .ln{position:absolute;border:2px solid rgba(255,255,255,.28)}
.half{position:relative;z-index:1}
.prow{display:flex;justify-content:space-around;padding:12px 2px}
.pl{display:flex;flex-direction:column;align-items:center;width:25%;max-width:84px;color:#fff;cursor:pointer;position:relative}
.pl .av{width:44px;height:44px;font-size:14px;box-shadow:0 0 0 2px #fff}
.pl .bdg{margin-top:-9px;position:relative;font-size:13px;font-weight:800;color:#fff;padding:1px 5px;border-radius:3px;font-family:var(--cond);letter-spacing:.02em;min-width:34px;text-align:center}
.pl .nm{margin-top:4px;font-family:var(--cond);font-weight:600;font-size:14px;line-height:1.1;text-align:center;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.pl .nm i{font-style:normal;opacity:.7;margin-right:3px}
.pl .evs{position:absolute;top:-4px;right:8px;display:flex;gap:2px}
.pl .evs span{width:16px;height:16px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center}
.pl .evs svg{width:12px;height:12px}
.brow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;min-width:0}
.brow:last-child{border:0}
.brow .n{color:var(--muted);width:20px;text-align:right;font-size:12px}
.brow .x{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{font-size:13px;font-weight:800;color:#fff;padding:2px 6px;border-radius:3px;flex:none;font-family:var(--cond);letter-spacing:.02em;min-width:34px;text-align:center}
.rsq{display:inline-flex;align-items:center;gap:6px;font-weight:800}
.rsq i{width:20px;height:20px;border-radius:3px;display:inline-block}

/* Clasificación */
.tblw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tbl th{color:var(--muted);font-weight:500;font-size:12.5px;text-align:center;padding:10px 4px}
.tbl td{padding:12px 3px;text-align:center}
.tbl th{padding:10px 3px}
.tbl .tm{text-align:left}
.tbl td.tm div{display:flex;align-items:center;gap:8px;max-width:118px}
.tbl td.tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl tr.r{cursor:pointer}
.tbl td:first-child,.tbl th:first-child{padding-left:16px;width:34px;text-align:left;position:relative}
.tbl td:last-child,.tbl th:last-child{padding-right:14px}
.tbl tr.zl th{font-weight:500;text-align:left;padding-top:14px}
.zb{position:absolute;left:4px;top:0;bottom:0;width:3px}
.tbl tr.hh td{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.tbl tr.ha td{background:color-mix(in srgb,var(--blue) 24%,transparent)}
details.rules{margin:4px 12px 12px;background:var(--surface2);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.5}
details.rules summary{font-weight:700;color:var(--fg);font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.rules summary::-webkit-details-marker{display:none}
details.rules ul{padding:0;list-style:none;margin:10px 0}
details.rules li{display:flex;align-items:center;gap:10px;margin:6px 0}
details.rules li i{width:10px;height:10px;border-radius:50%}
.fmx{display:inline-flex;gap:3px}
.fmx i{width:20px;height:20px;border-radius:4px;color:#fff;font-size:11px;font-weight:800;line-height:20px;text-align:center;font-style:normal}
.fW{background:var(--ok)}.fD{background:#8d909a}.fL{background:#d63b3b}

/* Jugador */
.club-card{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.club-card b{font-size:17px;display:block}
.club-card span{color:var(--muted);font-size:13.5px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 6px;text-align:center;padding:16px 10px}
.facts small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.facts b{font-size:17px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.mv{display:flex;align-items:center;gap:12px;margin:0 12px 14px;background:var(--surface2);border-radius:14px;padding:12px 14px}
.mv .v{padding-right:12px;border-right:1px solid var(--line)}
.mv .v small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.mv .v b{color:#f39c12;font-size:20px}
.mv p{flex:1;font-size:13px;line-height:1.35}
.mv button{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;flex:none;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.mv button.on{outline:2px solid var(--accent)}
.kv{display:flex;justify-content:space-between;padding:11px 0;font-size:14.5px;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}
.kv span{color:var(--muted)}
.brk{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px;padding:8px 0;font-size:14.5px}
.brk .bar{position:relative;height:8px;background:var(--surface2);border-radius:4px}
.brk .bar::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.6}
.brk .bar i{position:absolute;top:0;bottom:0;border-radius:3px}
canvas.heat{width:100%;aspect-ratio:105/68;border-radius:6px;display:block}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.lrow:last-child{border:0}
.lrow .d{color:var(--muted);font-size:12px;width:46px;flex:none;line-height:1.3}
.lrow .t{flex:1;min-width:0}
.lrow .t div{display:flex;align-items:center;gap:8px;height:22px}
.lrow .t div span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .t div.lose{color:var(--muted)}
.lrow .s{display:flex;flex-direction:column;align-items:flex-end;font-weight:700}
.lrow .s span{height:22px;line-height:22px;display:flex;align-items:center;gap:4px}
.evi{display:inline-flex;gap:3px;align-items:center;color:var(--fg)}
.evi svg{width:15px;height:15px}

/* Hoja inferior del jugador */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:500px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;max-height:88vh;display:flex;flex-direction:column;padding-bottom:var(--sb)}
#sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 4px;flex:none}
.sh-body{overflow-y:auto;padding:8px 16px 8px}
.sh-top{display:flex;align-items:center;gap:14px;padding:6px 0 10px}
.sh-top b{font-size:20px;display:block}
.sh-car{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 16px 12px;border-top:1px solid var(--line);flex:none}
.sh-car::-webkit-scrollbar{display:none}
.sh-car button{flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 6px;border-radius:12px;background:var(--surface2);font-weight:600;font-size:14px}
.sh-car button.on{background:var(--fg);color:var(--bg)}
.sh-car .av{width:32px;height:32px;font-size:11px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;width:100%;margin:12px 0 4px}

.sect{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:20px var(--gr) 0 var(--gl)}
.empty{padding:34px 22px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.foot{font-size:11.5px;color:var(--muted);text-align:center;padding:20px var(--gr) 8px var(--gl);line-height:1.5}
.search{margin:12px var(--gr) 0 var(--gl);display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:0 16px;border:1px solid var(--line)}
.search svg{width:19px;height:19px;color:var(--muted)}
.search input{flex:1;border:0;background:none;font:inherit;font-size:16px;color:var(--fg);padding:12px 0;outline:none}
.opt{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.opt:last-child{border:0}
.opt .rad{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted)}
.opt .rad.on{border:6px solid var(--accent)}
.steps{padding-left:20px;line-height:1.7;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

function poll(m){

function shotMap(p,seed){const r=rng('sh'+p.id+seed),n=POSG[p.pos]==='DEL'?26:POSG[p.pos]==='MED'?12:4;let dots='';
 for(let i=0;i<n;i++){const x=40+r()*260,y=10+Math.pow(r(),1.6)*150,goal=r()<.18;dots+=`<circle cx="${x}" cy="${y}" r="${goal?6:4.5}" fill="${goal?'var(--accent)':'none'}" stroke="${goal?'#fff':'var(--muted)'}" stroke-width="1.6"/>`}
 return `<svg viewBox="0 0 340 220" width="100%" style="background:#c9e9c4;border-radius:6px"><g fill="none" stroke="#8aa889" stroke-width="2"><rect x="2" y="2" width="336" height="216"/><rect x="80" y="2" width="180" height="66"/><rect x="130" y="2" width="80" height="24"/><path d="M130 68a40 40 0 0 0 80 0"/><path d="M110 218a60 60 0 0 1 120 0"/></g>${dots}</svg><p style="font-size:12px;color:var(--muted);margin-top:8px;display:flex;gap:14px"><span style="display:flex;gap:6px;align-items:center"><i style="width:10px;height:10px;border-radius:50%;background:var(--accent)"></i>Gol</span><span style="display:flex;gap:6px;align-items:center"><i style="width:10px;height:10px;border-radius:50%;border:2px solid var(--muted)"></i>Tiro</span></p>`}
function drawHeat(cv){
 const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,r=rng(cv.dataset.seed),[cx,cy]=POSXY[cv.dataset.pos]||[.5,.5],dot=cv.dataset.dot;
 ctx.fillStyle='#c9e9c4';ctx.fillRect(0,0,W,H);
 if(!dot){const off=document.createElement('canvas');off.width=W;off.height=H;const o=off.getContext('2d');
  for(let i=0;i<70;i++){const x=(cx+(r()-.5)*.38)*W,y=(cy+(r()-.5)*.55)*H,rad=W*(.06+r()*.07),g=o.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,'rgba(0,0,0,.17)');g.addColorStop(1,'rgba(0,0,0,0)');o.fillStyle=g;o.fillRect(0,0,W,H)}
  const src=o.getImageData(0,0,W,H).data,img=ctx.getImageData(0,0,W,H),d=img.data,stops=[[0,[201,233,196]],[.25,[226,236,120]],[.5,[250,226,40]],[.75,[247,150,20]],[1,[230,50,30]]];
  for(let i=0;i<d.length;i+=4){const a=Math.min(1,src[i+3]/255*1.3);if(a<.05)continue;let k=0;while(k<stops.length-2&&a>stops[k+1][0])k++;const[p0,c0]=stops[k],[p1,c1]=stops[k+1],f=(a-p0)/(p1-p0);for(let j=0;j<3;j++)d[i+j]=c0[j]+(c1[j]-c0[j])*f}
  ctx.putImageData(img,0,0)}
 const lw=Math.max(1.5,W/200);ctx.strokeStyle='#8aa889';ctx.lineWidth=lw;ctx.strokeRect(lw,lw,W-2*lw,H-2*lw);ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
 ctx.beginPath();ctx.arc(W/2,H/2,H*.14,0,Math.PI*2);ctx.stroke();ctx.strokeRect(lw,H*.22,W*.16,H*.56);ctx.strokeRect(W-lw-W*.16,H*.22,W*.16,H*.56);ctx.strokeRect(lw,H*.37,W*.055,H*.26);ctx.strokeRect(W-lw-W*.055,H*.37,W*.055,H*.26);
 if(dot){ctx.fillStyle='#e2001a';ctx.beginPath();ctx.arc(cx*W,cy*H,H*.09,0,Math.PI*2);ctx.fill()}}

/* ===== Hoja inferior del jugador ===== */
let sheetCtx=[];
function openSheet(id,ctxTeam){const p=PLAYERS[id];if(!p)return;
 if(ctxTeam&&FEAT&&(ctxTeam==='rma'||ctxTeam==='bar')&&location.hash.includes('rma-bar')){const s=ctxTeam==='rma'?'h':'a';sheetCtx=FEAT.lineups[s].flat().map(x=>slug(x.n))}
 else if(!sheetCtx.includes(id))sheetCtx=playersOf(p.team).map(x=>x.id);
 renderSheet(id);document.getElementById('scrim').classList.add('on');document.getElementById('sheet').classList.add('on')}
function renderSheet(id){const p=PLAYERS[id],games=pGames(p).slice(0,5),fr=featRating(id),rt=fr!=null&&location.hash.includes('rma-bar')?fr:avgRt(p);
 document.getElementById('sheet').innerHTML=`<div class="grab" data-close></div><div class="sh-body"><div class="sh-top">${avatar(p,64)}<div style="flex:1;min-width:0"><b>${p.n}</b><span class="rsq num" style="font-size:20px;margin-top:4px"><i style="background:${rc(rt)}"></i>${rt.toFixed(2)}</span></div><button class="circ${has('p',id)?' on':''}" data-fav="p:${id}" aria-label="Seguir jugador">${has('p',id)?I.starOn:I.star}</button></div>
  ${games.map(x=>gameLine(x.m,null,`<span class="evi">${x.yc?'<i class="yc" style="width:9px;height:13px"></i>':''}${I.goal.repeat(x.g)}${I.boot.repeat(x.a)}</span>`).replace(/<\/div>$/,`${rbadge(x.rt)}</div>`)).join('')}
  <button class="btn" data-go="jugador-${id}">Ver perfil completo ${I.chevR.replace('<svg','<svg width="16" height="16"')}</button></div>
  <div class="sh-car">${sheetCtx.map(pid=>{const q=PLAYERS[pid];return `<button class="${pid===id?'on':''}" data-swap="${pid}">${avatar(q,32)}${short(q.n)}${flag(q.nat)}</button>`}).join('')}</div>`;
 const on=document.querySelector('.sh-car .on');if(on)on.scrollIntoView({inline:'center',block:'nearest'})}
function closeSheet(){document.getElementById('scrim').classList.remove('on');document.getElementById('sheet').classList.remove('on')}

/* ===== Otras vistas ===== */
function plainHdr(t){setGrad('#000');return `<header class="hdr"><div class="hrow"><img class="logo" src="icons/logo.png" alt=""><b style="font-size:20px;letter-spacing:-.02em">${t}</b></div></header>`}
function viewFav(){setNav('favoritos');
 const ms=fav.m.map(id=>MATCHES[id]).filter(Boolean),ts=fav.t.filter(id=>T[id]),ps=fav.p.filter(id=>PLAYERS[id]),cs=fav.c.filter(id=>COMPS[id]);
 let h=plainHdr('Favoritos');
 if(!ms.length&&!ts.length&&!ps.length)h+=`<div class="card"><div class="empty"><b>Aún no sigues nada</b>Pulsa la estrella en un partido, un equipo o un jugador y aparecerá aquí. Con la campana activas los avisos.</div></div>`;
 if(ts.length)h+=`<div class="sect">Equipos</div><section class="card pad">${ts.map(id=>`<div class="brow" data-go="equipo-${id}">${crest(id,28)}<span class="x">${T[id].n}</span><span class="fmx">${table(T[id].comp).find(r=>r.id===id).fm.map(x=>`<i class="f${x}">${x==='W'?'G':x==='D'?'E':'P'}</i>`).join('')}</span></div>`).join('')}</section>`;
 if(ps.length)h+=`<div class="sect">Jugadores</div><section class="card pad">${ps.map(id=>`<div class="brow" data-go="jugador-${id}">${avatar(PLAYERS[id],32)}<span class="x">${PLAYERS[id].n}</span>${rbadge(avgRt(PLAYERS[id]))}</div>`).join('')}</section>`;
 if(ms.length)h+=`<div class="sect">Partidos</div><section class="card">${ms.map(m=>matchRow(m,true)).join('')}</section>`;
 if(cs.length)h+=`<div class="sect">Competiciones fijadas</div><section class="card">${cs.map(compHead).join('')}</section>`;
 app.innerHTML=h}
function viewLeagues(){setNav('ligas');app.innerHTML=plainHdr('Competiciones')+`<div class="sect">Fútbol</div><section class="card">${Object.keys(COMPS).map(compHead).join('')}</section><p class="foot">Las fijadas (estrella) salen primero en Partidos.</p>`}
function viewSearch(){setNav('partidos');
 app.innerHTML=`<header class="hdr"><div class="hrow">${backBtn()}<label class="sbox" style="color:#fff">${I.search}<input id="q" type="search" placeholder="Equipo, jugador o competición" autocomplete="off" aria-label="Buscar" style="flex:1;border:0;background:none;color:#fff;font:inherit;font-size:16px;outline:none"></label></div></header><div id="res"></div>`;
 const q=document.getElementById('q'),res=document.getElementById('res');
 const run=()=>{const v=slug(q.value);if(v.length<2){res.innerHTML=`<div class="sect">Sugerencias</div><section class="card pad">${['kylian-mbappe','lamine-yamal','pedri'].map(id=>`<div class="brow" data-go="jugador-${id}">${avatar(PLAYERS[id],32)}<span class="x">${PLAYERS[id].n}</span></div>`).join('')}${['rma','bar'].map(id=>`<div class="brow" data-go="equipo-${id}">${crest(id,28)}<span class="x">${T[id].n}</span></div>`).join('')}</section>`;return}
  const tt=Object.values(T).filter(t=>slug(t.n).includes(v)).slice(0,8),pp=Object.values(PLAYERS).filter(p=>p.id.includes(v)).slice(0,10),cc=Object.values(COMPS).filter(c=>slug(c.n).includes(v));let h='';
  if(cc.length)h+=`<div class="sect">Competiciones</div><section class="card">${cc.map(c=>compHead(c.id)).join('')}</section>`;
  if(tt.length)h+=`<div class="sect">Equipos</div><section class="card pad">${tt.map(t=>`<div class="brow" data-go="equipo-${t.id}">${crest(t.id,28)}<span class="x">${t.n}</span><span style="color:var(--muted);font-size:12px">${COMPS[t.comp].n}</span></div>`).join('')}</section>`;
  if(pp.length)h+=`<div class="sect">Jugadores</div><section class="card pad">${pp.map(p=>`<div class="brow" data-go="jugador-${p.id}">${avatar(p,32)}<span class="x">${esc(p.n)}</span><span style="color:var(--muted);font-size:12px">${T[p.team].n}</span></div>`).join('')}</section>`;
  res.innerHTML=h||`<div class="card"><div class="empty"><b>Sin resultados</b>No hay nada que coincida con «${esc(q.value)}».</div></div>`};
 q.addEventListener('input',run);run();setTimeout(()=>q.focus(),50)}
function viewSettings(){setNav('ajustes');const th=store.get('md-theme','dark'),standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
 app.innerHTML=plainHdr('Ajustes')+`<div class="sect">Apariencia</div><section class="card pad">${[['dark','Oscuro'],['light','Claro'],['system','Según el sistema']].map(([k,l])=>`<div class="opt" data-theme-set="${k}"><span>${l}</span><span class="rad${th===k?' on':''}"></span></div>`).join('')}</section>
  <div class="sect">Instalar en el iPhone</div><section class="card pad">${standalone?'<p style="font-size:14px">Ya tienes MARCA Datos instalada como app.</p>':`<ol class="steps"><li>Abre esta página en <b>Safari</b>.</li><li>Pulsa el botón <b>Compartir</b> (cuadrado con flecha).</li><li>Elige <b>Añadir a pantalla de inicio</b> y pulsa <b>Añadir</b>.</li><li>Abre MARCA Datos desde el icono: se verá a pantalla completa.</li></ol>`}</section>
  <div class="sect">Acerca de</div><section class="card pad"><div class="kv"><span>Versión</span><b>0.2 · prototipo</b></div><div class="kv"><span>Datos</span><b>De ejemplo</b></div><div class="kv"><span>Directo</span><b>Simulado</b></div><div class="opt" data-reset><span style="color:var(--accent)">Borrar favoritos y votos</span></div></section>`}
function applyTheme(){const th=store.get('md-theme','dark'),dark=th==='dark'||(th==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light'}

/* ===== Router y eventos ===== */
let depth=0;
function route(keep){closeSheet();const h=location.hash.slice(1)||'partidos';let m;
 if((m=h.match(/^partido-(.+)$/)))viewMatch(m[1]);else if((m=h.match(/^equipo-(.+)$/)))viewTeam(m[1]);else if((m=h.match(/^jugador-(.+)$/)))viewPlayer(m[1]);else if((m=h.match(/^liga-(.+)$/)))viewComp(m[1]);
 else if(h==='favoritos')viewFav();else if(h==='ligas')viewLeagues();else if(h==='buscar')viewSearch();else if(h==='ajustes')viewSettings();else{setGrad('#000');viewHome()}
 if(!keep)window.scrollTo(0,0)}
function rerender(){const y=window.scrollY,sh=document.getElementById('sheet').classList.contains('on'),cur=document.querySelector('.sh-car .on');route(true);window.scrollTo(0,y);if(sh&&cur){document.getElementById('scrim').classList.add('on');document.getElementById('sheet').classList.add('on');renderSheet(cur.dataset.swap)}}
window.addEventListener('hashchange',()=>route());
document.addEventListener('click',e=>{const q=s=>e.target.closest(s);let el;
 if(q('#scrim')||q('[data-close]'))return closeSheet();
 if((el=q('[data-swap]')))return renderSheet(el.dataset.swap);
 if((el=q('[data-fav]'))){e.stopPropagation();const[k,id]=el.dataset.fav.split(':');const on=tog(k,id);toast(on?'Añadido a favoritos':'Quitado de favoritos');return rerender()}
 if((el=q('[data-bell]'))){e.stopPropagation();const on=tog('b',el.dataset.bell);toast(on?'Avisos activados':'Avisos desactivados');return rerender()}
 if((el=q('[data-vote]'))){const[id,k]=el.dataset.vote.split(':');store.set('md-vote-'+id,k);return rerender()}
 if((el=q('[data-mv]'))){const[id,k]=el.dataset.mv.split(':');store.set('md-mv-'+id,k);toast('Gracias por tu voto');return rerender()}
 if((el=q('[data-sheet]'))){e.stopPropagation();return openSheet(el.dataset.sheet,el.dataset.ctx)}
 if(q('[data-back]')){if(depth>0){depth--;history.back()}else location.hash='partidos';return}
 if((el=q('[data-tab]'))){const[k,t]=el.dataset.tab.split(':');S.tab[k]=t;return rerender()}
 if((el=q('[data-smode]'))){const[c,k]=el.dataset.smode.split(':');S.smode[c]=k;return rerender()}
 if((el=q('[data-lu]'))){S.lu=el.dataset.lu;return rerender()}
 if((el=q('[data-dstep]'))){const v=+el.dataset.dstep;S.day=v===0?0:clamp(S.day+v,-7,7);return route()}
 if((el=q('[data-sport]'))){S.sport=el.dataset.sport;return rerender()}
 if((el=q('[data-seg]'))){S.seg=el.dataset.seg;return rerender()}
 if(q('[data-live]')){S.live=!S.live;return rerender()}
 if(q('[data-fonly]')){S.fonly=!S.fonly;toast(S.fonly?'Solo competiciones fijadas':'Todas las competiciones');return rerender()}
 if((el=q('[data-toast]')))return toast(el.dataset.toast);
 if(q('[data-share]')){const u=location.href;(navigator.share?navigator.share({title:'MARCA Datos',url:u}):navigator.clipboard.writeText(u).then(()=>toast('Enlace copiado'))).catch(()=>{});return}
 if((el=q('[data-theme-set]'))){store.set('md-theme',el.dataset.themeSet);applyTheme();return rerender()}
 if(q('[data-reset]')){fav={m:[],t:[],p:[],c:['laliga'],b:[]};store.set('md-fav',fav);Object.keys(localStorage).filter(k=>k.startsWith('md-vote')||k.startsWith('md-mv')).forEach(k=>localStorage.removeItem(k));toast('Borrado');return rerender()}
 if((el=q('[data-go]'))){depth++;location.hash=el.dataset.go}});
document.addEventListener('change',e=>{if(e.target.id==='season'){S.season[e.target.dataset.season]=e.target.value;rerender()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'){const g=e.target.closest&&e.target.closest('[data-go]');if(g){depth++;location.hash=g.dataset.go}}});
// Deslizar la hoja hacia abajo para cerrarla
(function(){const sh=document.getElementById('sheet');let y0=null;sh.addEventListener('touchstart',e=>{if(e.target.closest('.grab,.sh-top'))y0=e.touches[0].clientY},{passive:true});sh.addEventListener('touchmove',e=>{if(y0!=null){const dy=e.touches[0].clientY-y0;if(dy>0)sh.style.transform=`translateY(${dy}px)`}},{passive:true});sh.addEventListener('touchend',e=>{if(y0!=null){const dy=e.changedTouches[0].clientY-y0;sh.style.transform='';if(dy>90)closeSheet();y0=null}})})();

/* Directo simulado */
setInterval(()=>{let ended=false;
 Object.values(MATCHES).filter(m=>m.st==='LIVE').forEach(m=>{if(String(m.min).startsWith('90+')){m.st='FT';ended=true;return}const n=parseInt(m.min)+1;m.min=n>=90?'90+1':n;document.querySelectorAll(`[data-min="${m.id}"]`).forEach(el=>el.textContent=m.min+"'")});
 if(ended&&!document.getElementById('sheet').classList.contains('on'))rerender()},20000);

applyTheme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
route();
setTimeout(()=>document.getElementById('splash').classList.add('out'),matchMedia('(prefers-reduced-motion: reduce)').matches?0:900);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
